<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Postcard backs — print files (G)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
a{color:#B5533A}a:hover{color:#5B4E3E}
body{margin:0;padding:40px;background:#efeae2;font:400 12px/1.5 "JetBrains Mono",monospace;color:#5B4E3E}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:16px 24px;margin:0 0 28px}
h1{margin:0;font:500 28px/1.1 "Cormorant Garamond",serif;color:#2B241D}
.spec{color:#8A7862}
button{white-space:nowrap;flex-shrink:0;font:500 12px/1 "JetBrains Mono",monospace;padding:9px 14px;border:1px solid #5B4E3E;background:#fff;color:#2B241D;cursor:pointer}
button:hover{background:#5B4E3E;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px}
.item{display:flex;flex-direction:column;gap:8px}
.item canvas{width:100%;height:auto;background:#fff;box-shadow:0 1px 2px rgba(60,40,20,.12),0 8px 24px rgba(60,40,20,.10)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row button{padding:6px 10px;font-size:11px}
</style>
</head>
<body>
<header><h1>Postcard backs · G</h1><span class="spec">109 × 152 mm · 300 dpi · 1287 × 1795 px · RGB TIFF · text 10 mm from edges</span><button id="all">Download all 15 TIFF</button></header>
<div class="grid" id="grid"></div>
<script>
const titles=["Багрянці","У затінку саду","Ожина","Простір","Сосна. Пісня гірського вітру","Тепло","Вечірній ліхтар","Місто моє","Їжакові стежки","Березовий гай, травневий спокій","Єдиний промінь","Руда лисиця","Подвір'я, що спить","Ранній іній","Щебет птахів"];
const mm=300/25.4,W=Math.round(109*mm),H=Math.round(152*mm),M=10*mm,FS=3.25*mm,LS=3*mm,F='"Cormorant Garamond"';
function draw(cv,t){const c=cv.getContext('2d');cv.width=W;cv.height=H;c.fillStyle='#fff';c.fillRect(0,0,W,H);
c.font=`500 ${FS}px ${F}`;c.letterSpacing=(0.08*FS)+'px';c.fillStyle='#5B4E3E';const nm='ГАЙДАМАКА ОЛЯ',base=M+c.measureText(nm).actualBoundingBoxAscent;c.fillText(nm,M,base);
c.letterSpacing='0px';c.font=`italic 400 ${FS}px ${F}`;c.fillStyle='#8A7862';c.fillText(`«${t}»`,M,base+4.75*mm);
c.font=`italic 400 ${LS}px ${F}`;c.fillStyle='#B5533A';c.fillText('haydamaka.com',M,H-M-c.measureText('haydamaka.com').actualBoundingBoxDescent);}
function packbits(r,out){let i=0;const n=r.length;while(i<n){let j=i;while(j<n-1&&j-i<127&&r[j]===r[j+1])j++;
if(j>i){out.push((257-(j-i+1))&255,r[i]);i=j+1;}else{const s=i;while(i<n&&i-s<128&&!(i<n-1&&r[i]===r[i+1]))i++;out.push(i-s-1);for(let k=s;k<i;k++)out.push(r[k]);}}}
function tiff(cv){const d=cv.getContext('2d').getImageData(0,0,W,H).data,row=new Uint8Array(W*3),body=[];
for(let y=0;y<H;y++){for(let x=0;x<W;x++){const s=(y*W+x)*4;row[x*3]=d[s];row[x*3+1]=d[s+1];row[x*3+2]=d[s+2];}packbits(row,body);}
const tags=[[256,3,W],[257,3,H],[258,3,0,3],[259,3,32773],[262,3,2],[273,4,0],[277,3,3],[278,3,H],[279,4,body.length],[282,5,0],[283,5,0],[296,3,2]];
const ifd=8,isz=2+tags.length*12+4,bps=ifd+isz,res=bps+6,dat=res+16,buf=new ArrayBuffer(dat+body.length),v=new DataView(buf);
v.setUint16(0,0x4949,true);v.setUint16(2,42,true);v.setUint32(4,ifd,true);v.setUint16(ifd,tags.length,true);
tags.forEach((t,i)=>{const o=ifd+2+i*12;let val=t[2];if(t[0]===258)val=bps;if(t[0]===273)val=dat;if(t[0]===282)val=res;if(t[0]===283)val=res+8;
v.setUint16(o,t[0],true);v.setUint16(o+2,t[1],true);v.setUint32(o+4,t[3]||1,true);if(t[1]===3&&!t[3])v.setUint16(o+8,val,true);else v.setUint32(o+8,val,true);});
for(let i=0;i<3;i++)v.setUint16(bps+i*2,8,true);[300,1,300,1].forEach((x,i)=>v.setUint32(res+i*4,x,true));
new Uint8Array(buf).set(body,dat);return new Blob([buf],{type:'image/tiff'});}
const fname=(i,t)=>`${String(i+1).padStart(2,'0')} ${t.replace(/[.,]/g,'')}.tiff`;
function dl(i){const cv=document.querySelectorAll('canvas')[i],a=document.createElement('a');a.href=URL.createObjectURL(tiff(cv));a.download=fname(i,titles[i]);document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);}
document.fonts.load(`500 40px ${F}`,'ГАЙДАМАКА').then(()=>document.fonts.load(`italic 400 40px ${F}`,'«Щедрий» haydamaka')).then(()=>{
const g=document.getElementById('grid');titles.forEach((t,i)=>{const it=document.createElement('div');it.className='item';it.dataset.screenLabel=String(i+1).padStart(2,'0');
const cv=document.createElement('canvas');draw(cv,t);const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${String(i+1).padStart(2,'0')} · ${t}</span>`;
const b=document.createElement('button');b.textContent='TIFF';b.onclick=()=>dl(i);r.appendChild(b);it.append(cv,r);g.appendChild(it);});});
document.getElementById('all').onclick=async()=>{for(let i=0;i<titles.length;i++){dl(i);await new Promise(r=>setTimeout(r,600));}};
</script>
</body>
</html>
